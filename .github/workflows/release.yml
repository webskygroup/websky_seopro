name: Build release package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenCart package
        run: zip -r websky_seo.ocmod.zip admin catalog install.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: websky_seo.ocmod.zip
          generate_release_notes: true
