name: Build release package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build OpenCart package
        run: zip -r websky_seo.ocmod.zip admin catalog system install.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "Websky SEO Pro ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" websky_seo.ocmod.zip --clobber
